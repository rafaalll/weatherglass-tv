name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar SDK 34 direto
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Rodar build.sh do projeto
        run: |
          SCRIPT=$(find . -maxdepth 3 -name "build.sh" | head -n 1)
          chmod +x "$SCRIPT"
          cd "$(dirname "$SCRIPT")"
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weatherglass-apk
          path: "**/*.apk"
